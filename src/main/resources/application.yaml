server:
  port: 8084

spring:
  application:
    name: usuario-api

  datasource:
    url: jdbc:postgresql://localhost:5432/db_usuario
    username: postgres
    password: ${DB_PASSWORD:changeme}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${APP_JWT_SECRET:chave-super-secreta-minima-32-caracteres-para-HS512-2026}
  expiration-ms: 3600000
  service-expiration: 1800000