server:
  port: 8080

spring:
  application:
    name: usuario-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/db_usuario}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect