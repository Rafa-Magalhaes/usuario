server:
  port: 8080

spring:
  application:
    name: usuario-api

  datasource:
    url: jdbc:postgresql://localhost:5432/db_usuario
    username: postgres
    password: ${DB_PASSWORD:changeme}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:minhaChaveSuperSecretaParaAssinarOToken1234567890}
  expiration: 3600000